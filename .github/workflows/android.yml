name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned web dependencies
        run: npm install --no-audit --no-fund
      - name: Build offline web bundle
        run: npm run build
      - name: Install browser for smoke checks
        run: npx playwright install --with-deps chromium
      - name: Check rendering, controls, and GLB import
        run: npm test
      - name: Upload viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-checks
          path: playwright-output/
          if-no-files-found: ignore
      - name: Package web assets
        run: |
          mkdir -p app/src/main/assets/public
          cp -R dist/. app/src/main/assets/public/
      - name: Build and lint Android APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature and packaged assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/index.html'
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/AEGIS-X01.apk
          cd artifacts
          sha256sum AEGIS-X01.apk > AEGIS-X01.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-X01-APK
          path: artifacts/
          retention-days: 90
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" artifacts/AEGIS-X01.apk artifacts/AEGIS-X01.apk.sha256 \
            --title "AEGIS-X01 Android · Build ${{ github.run_number }}" \
            --notes "Installable debug APK for Android 8.0+. Offline procedural Three.js viewer, orbit and zoom controls, lighting adjustments, and local self-contained GLB import. This is an artist approximation, not an exact reconstruction of the unavailable reference. Built and linted in GitHub Actions; desktop WebGL smoke checks passed. Physical Android device testing is still recommended. Debug certificates may change between builds, requiring uninstall before an update." \
            --target "${{ github.sha }}" --latest
